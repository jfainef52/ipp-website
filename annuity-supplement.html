const PREVIEW = URL_PARAMS.get("preview") === "1"; // ?preview=1 runs the form without saving or sending anything

async function callIntake(payload) {
  let res;
  try {
    res = await fetch(INTAKE_API, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SB_PUBLISHABLE },
      body: JSON.stringify({ token: LINK_TOKEN, ...payload }),
    });
  } catch (e) { return { ok: false, error: "offline" }; }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  return res.ok && data.ok ? data : { ok: false, error: data.error || "failed" };
}

// A readable copy of the answers, grouped the way the client saw them. Stored encrypted with the raw answers.
function buildAdvisorSummary(screens, answers) {
  const sections = [], skipped = [];
  screens.forEach(s => {
    const section = SECTION_LABELS[s.questions[0].phase] || "";
    const items = s.questions.filter(q => hasAnswer(q, answers[q.id])).map(q => ({ label: labelFor(q), value: fmtAnswer(q, answers[q.id], answers) }));
    const missing = s.questions.filter(q => !hasAnswer(q, answers[q.id])).map(q => labelFor(q));
    if (items.length) sections.push({ title: s.title, section, items });
    if (missing.length) skipped.push({ title: s.title, section, labels: missing });
  });
  return { sections, skipped };
}

function buildSequence(answers) {

  intake_done: "Already completed the Application Intake?", first_name: "First name", last_name: "Last name", email: "Email address",

  additional_notes: "Anything else for your advisor",
};
function labelFor(q) { return LABELS[q.id] || q.q; }

function buildScreens(answers) {
  const out = [];
  SCREEN_DEFS.forEach(def => {
    const pf = def.prefix || "";
    const vis = k => { const q = qMap[pf + k]; return q && (q.condition ? q.condition(answers) : true) ? q : null; };
    const rows = [];
    def.keys.forEach(k => {
      if (Array.isArray(k)) { const cl = k.map(vis).filter(Boolean); if (cl.length) rows.push(cl); }
      else { const q = vis(k); if (q) rows.push([q]); }
    });
    if (rows.length) out.push({ id: def.id, title: def.tokens ? sub(def.title, def.tokens) : def.title, rows, questions: rows.flat() });
  });
  return out;
}

function formatPhone(s) {
  const d = String(s).replace(/\D/g, "");
  const n = d.length === 11 && d[0] === "1" ? d.slice(1) : d;
  return n.length === 10 ? "(" + n.slice(0, 3) + ") " + n.slice(3, 6) + "-" + n.slice(6) : String(s);
}
function formatSsn(s) {
  const d = String(s).replace(/\D/g, "");
  return d.length === 9 ? d.slice(0, 3) + "-" + d.slice(3, 5) + "-" + d.slice(5) : String(s);
}

function fmtAnswer(q, v, answers) {
  if (v === undefined || v === null || v === "") return "—";
  if (q.type === "currency") return fmtCurrency(v) || "—";
  if (q.type === "date") return fmtDate(v);
  if (q.type === "heightweight") {
    if (typeof v !== "object") return "—";
    const parts = [];
    if (v.feet !== undefined && v.feet !== "" && v.inches !== undefined && v.inches !== "") parts.push(`${v.feet}'${v.inches}"`);
    if (v.weight !== undefined && v.weight !== "") parts.push(`${v.weight} lbs`);
    return parts.length ? parts.join(", ") : "—";
  }
  if (q.type === "multi") {
    if (!Array.isArray(v) || v.length === 0) return "—";
    return v.map(id => {
      const o = q.options.find(x => x.id === id);
      if (o && o.other) { const tx = answers && answers[q.id + "__other"]; return tx ? "Something else: " + tx : o.label; }
      return o ? o.label : id;
    }).join(", ");
  }
  if (q.type === "single" || q.type === "select") {
    const opt = (q.options || []).find(o => o.id === v);
    if (opt && opt.other) { const tx = answers && answers[q.id + "__other"]; return tx ? "Something else: " + tx : opt.label; }
    return opt ? opt.label : v;
  }
  if (/(^|_)ssn(_tin)?$/.test(q.id)) return formatSsn(v);
  if (/phone$/.test(q.id)) return formatPhone(v);
  return String(v);
}

function CurrencyField({ value, onChange, placeholder, onEnter, inputRef, baseInputStyle }) {
  const format = raw => (raw === "" ? "" : Number(raw).toLocaleString("en-US"));
  const [display, setDisplay] = useState(format(value === undefined ? "" : value));

  useEffect(() => {
    setDisplay(format(value === undefined ? "" : value));
  }, [value]);

  const handleChange = e => {
    const input = e.target;
    const prevLen = input.value.length;
    const caret = input.selectionStart;
    const raw = input.value.replace(/[^0-9]/g, "");
    const nextDisplay = format(raw);
    setDisplay(nextDisplay);
    onChange(raw);
    // Keep the caret in roughly the same spot relative to the digits, accounting
    // for commas added/removed by the reformat.
    requestAnimationFrame(() => {
      if (!input) return;
      const delta = nextDisplay.length - prevLen;
      const pos = Math.max(0, (caret || 0) + delta);
      try { input.setSelectionRange(pos, pos); } catch (e) {}
    });
  };

  return (
    <div style={{ position: "relative" }}>
      <span style={{ position: "absolute", left: 16, top: "50%", transform: "translateY(-50%)", color: GRAY, fontSize: 15 }}>$</span>
      <input ref={inputRef} type="text" inputMode="numeric" value={display} placeholder={placeholder || "0"}
        onChange={handleChange} onKeyDown={e => e.key === "Enter" && onEnter()} style={{ ...baseInputStyle, paddingLeft: 30 }} />
    </div>
  );
}

function Field({ question, answer, onAnswer, onEnter, otherValue, onOther }) {
  const inputRef = useRef(null);
  useEffect(() => {
    if (["text", "email", "number", "currency"].includes(question.type) && inputRef.current) {
      setTimeout(() => inputRef.current && inputRef.current.focus(), 60);
    }
  }, [question.id]);

  const baseInputStyle = {
    width: "100%", padding: "15px 16px", background: "rgba(255,255,255,.05)",
    border: `1px solid ${BORDER}`, borderRadius: 10, color: OFFWHITE, fontSize: 15, outline: "none",
  };

  const otherInput = (
    <input type="text" autoFocus value={otherValue || ""} placeholder="Please tell us more"
      onChange={e => onOther && onOther(e.target.value)} style={{ ...baseInputStyle, marginTop: 4 }} />
  );
  if (question.type === "single") {
    const sel = question.options.find(o => o.id === answer);
    return (
      <>
        {question.options.map(o => (
          <ChoiceBtn key={o.id} label={o.label} selected={answer === o.id} onClick={() => onAnswer(o.id)} />
        ))}
        {sel && sel.other && otherInput}
      </>
    );
  }
  if (question.type === "select") {
    const sel = question.options.find(o => o.id === answer);
    return (
      <>
        <select value={answer || ""} onChange={e => onAnswer(e.target.value)} style={SELECT_STYLE}>
          <option value="" disabled>Select…</option>
          {question.options.map(o => <option key={o.id} value={o.id}>{o.label}</option>)}
        </select>
        {sel && sel.other && <div style={{ marginTop: 10 }}>{otherInput}</div>}
      </>
    );
  }
  if (question.type === "multi") {
    const sel = Array.isArray(answer) ? answer : [];
    const toggle = id => {
      let next;
      if (id === "none") next = sel.includes("none") ? [] : ["none"];
      else next = sel.includes(id) ? sel.filter(x => x !== id) : [...sel.filter(x => x !== "none"), id];
      onAnswer(next);
    };
    return (
      <>
        <p style={{ fontSize: 11, color: GRAY, marginBottom: 10, fontWeight: 600, letterSpacing: ".03em" }}>SELECT ALL THAT APPLY</p>
        {question.options.map(o => <ChoiceBtn key={o.id} label={o.label} selected={sel.includes(o.id)} onClick={() => toggle(o.id)} />)}
        {question.options.some(o => o.other && sel.includes(o.id)) && otherInput}
      </>
    );
  }
  if (question.type === "text" || question.type === "email") {
    return (
      <input ref={inputRef} type={question.type === "email" ? "email" : "text"} value={answer || ""} placeholder={question.placeholder || ""}
        onChange={e => onAnswer(e.target.value)} onKeyDown={e => e.key === "Enter" && onEnter()} style={baseInputStyle} />
    );
  }
  if (question.type === "textarea") {
    return (
      <textarea value={answer || ""} placeholder={question.placeholder || ""} rows={4}
        onChange={e => onAnswer(e.target.value)} style={{ ...baseInputStyle, resize: "vertical", lineHeight: 1.5 }} />
    );
  }
  if (question.type === "number") {
    return (
      <input ref={inputRef} type="number" inputMode="numeric" value={answer === undefined ? "" : answer} placeholder={question.placeholder || ""}
        onChange={e => onAnswer(e.target.value)} onKeyDown={e => e.key === "Enter" && onEnter()} style={baseInputStyle} />
    );
  }
  if (question.type === "currency") {
    return (
      <CurrencyField value={answer} onChange={onAnswer} placeholder={question.placeholder} onEnter={onEnter}
        inputRef={inputRef} baseInputStyle={baseInputStyle} />
    );
  }
  if (question.type === "date") {
    return <input type="date" value={answer || ""} onChange={e => onAnswer(e.target.value)} style={{ ...baseInputStyle, colorScheme: "dark" }} />;
  }
  if (question.type === "heightweight") {
    return <HeightWeightField value={answer} onChange={onAnswer} />;
  }
  return null;
}

function hasAnswer(question, answer) {
  if (answer === undefined || answer === null) return false;
  if (Array.isArray(answer)) return answer.length > 0;
  if (typeof answer === "object") return Object.values(answer).some(x => x !== undefined && x !== null && String(x).trim() !== "");
  return String(answer).trim() !== "";
}

// Everything can be skipped. The only thing blocked is a half-typed, invalid email.
function canContinue(question, answer) {
  if (!question) return false;
  if (question.type === "email" && hasAnswer(question, answer)) return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(answer).trim());
  return true;
}

function maskSensitive(q, text) {
  if (!text || text === "—") return text;
  const isSsn = /ssn/.test(q.id), isDl = /dl_number$/.test(q.id);
  if (!isSsn && !isDl) return text;
  const last4 = String(text).replace(/[^0-9A-Za-z]/g, "").slice(-4);
  return (isSsn ? "•••-••-" : "••••") + last4;
}

// Interim device save: answers are kept on this device only, expire after 12 hours,
// and are erased when the interview is finished. (The live version will save to the
// server instead, so nothing sensitive has to sit on a client's computer.)
const SAVE_KEY = "ipp_annuity_supplement_v1_" + (LINK_TOKEN ? LINK_TOKEN.slice(0, 10) : "preview");
const SAVE_TTL_MS = 12 * 60 * 60 * 1000;

function readSaved() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const saved = JSON.parse(raw);
    if (!saved || !saved.savedAt || Date.now() - saved.savedAt > SAVE_TTL_MS) { localStorage.removeItem(SAVE_KEY); return null; }
    return saved;
  } catch (e) { return null; }
}
function clearSaved() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

      color: selected ? GOLD2 : OFFWHITE,
    }}>
      <span style={{ width: 16, height: 16, flexShrink: 0, marginTop: 2, borderRadius: 4, border: `1.5px solid ${selected ? GOLD : "#5B7084"}`, background: selected ? GOLD : "transparent", color: NAVY, fontSize: 11, lineHeight: "13px", textAlign: "center", fontWeight: 700 }}>{selected ? "✓" : ""}</span>
      <span>{label}</span>
    </button>
  );
}

function FieldRow({ q, value, other, onChange, onOther }) {
  const [open, setOpen] = useState(false);
  const label = labelFor(q);
  const isYN = q.type === "single" && q.options.length === 2 && q.options[0].id === "yes" && q.options[1].id === "no";
  const inputStyle = { width: "100%", padding: "12px 14px", background: "rgba(255,255,255,.05)", border: `1px solid ${BORDER}`, borderRadius: 10, color: OFFWHITE, fontSize: 15, outline: "none" };
  const infoBtn = (
    <button type="button" onClick={() => setOpen(o => !o)} aria-label="Why we ask" style={{ marginLeft: 8, width: 18, height: 18, borderRadius: "50%", border: "1px solid #4A6070", color: GRAY, fontSize: 10, verticalAlign: "middle", lineHeight: "16px", padding: 0 }}>?</button>
  );
  const infoPanel = open && (
    <div style={{ margin: "6px 0 10px", padding: "10px 12px", borderRadius: 9, background: "rgba(255,255,255,.04)", fontSize: 12.5, lineHeight: 1.55, color: GRAY }}>
      {q.q !== label && <div style={{ marginBottom: q.why ? 6 : 0 }}><span style={{ color: WARM }}>Full question: </span>{q.q}</div>}
      {q.why && <div><span style={{ color: WARM }}>Why we ask: </span>{q.why}</div>}
    </div>
  );

  if (isYN) {
    return (
      <div style={{ borderBottom: "1px solid rgba(255,255,255,.07)", padding: "10px 0" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ flex: 1, fontSize: 14.5, lineHeight: 1.4, color: OFFWHITE }}>{label}{infoBtn}</div>
          <div style={{ display: "flex", gap: 8, flexShrink: 0 }}>
            {q.options.map(o => <Pill key={o.id} label={o.label} selected={value === o.id} onClick={() => onChange(o.id)} />)}
          </div>
        </div>
        {infoPanel}
      </div>
    );
  }

  let control = null, showOther = false;
  const sel = (q.options || []).find(o => o.id === value);
  if (q.type === "single") {
    control = <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>{q.options.map(o => <Pill key={o.id} label={o.label} selected={value === o.id} onClick={() => onChange(o.id)} />)}</div>;
    showOther = !!(sel && sel.other);
  } else if (q.type === "select") {
    control = (
      <select value={value || ""} onChange={e => onChange(e.target.value)} style={SELECT_STYLE}>
        <option value="" disabled>Select…</option>
        {q.options.map(o => <option key={o.id} value={o.id}>{o.label}</option>)}
      </select>
    );
    showOther = !!(sel && sel.other);
  } else if (q.type === "multi") {
    const cur = Array.isArray(value) ? value : [];
    const toggle = id => {
      let next;
      if (id === "none") next = cur.includes("none") ? [] : ["none"];
      else next = cur.includes(id) ? cur.filter(x => x !== id) : [...cur.filter(x => x !== "none"), id];
      onChange(next);
    };
    control = <div>{q.options.map(o => <CheckItem key={o.id} label={o.label} selected={cur.includes(o.id)} onClick={() => toggle(o.id)} />)}</div>;
    showOther = q.options.some(o => o.other && cur.includes(o.id));
  } else if (q.type === "text" || q.type === "email") {
    control = <input type={q.type === "email" ? "email" : "text"} value={value || ""} placeholder={q.placeholder || ""} onChange={e => onChange(e.target.value)} style={inputStyle} />;
  } else if (q.type === "number") {
    control = <input type="number" inputMode="numeric" value={value === undefined ? "" : value} placeholder={q.placeholder || ""} onChange={e => onChange(e.target.value)} style={inputStyle} />;
  } else if (q.type === "currency") {
    control = <CurrencyField value={value} onChange={onChange} placeholder={q.placeholder} onEnter={() => {}} inputRef={null} baseInputStyle={inputStyle} />;
  } else if (q.type === "date") {
    control = <input type="date" value={value || ""} onChange={e => onChange(e.target.value)} style={{ ...inputStyle, colorScheme: "dark" }} />;
  } else if (q.type === "textarea") {
    control = <textarea value={value || ""} placeholder={q.placeholder || ""} rows={3} onChange={e => onChange(e.target.value)} style={{ ...inputStyle, resize: "vertical", lineHeight: 1.5 }} />;
  } else if (q.type === "heightweight") {
    control = <HeightWeightField value={value} onChange={onChange} />;
  }

  return (
    <div style={{ marginBottom: 20, paddingTop: 4 }}>
      <div style={{ fontSize: 13.5, fontWeight: 600, color: WARM, marginBottom: 8, lineHeight: 1.4 }}>{label}{infoBtn}</div>
      {infoPanel}
      {control}
      {showOther && (
        <input type="text" value={other || ""} placeholder="Please tell us more" onChange={e => onOther(e.target.value)} style={{ ...inputStyle, marginTop: 8 }} />
      )}
    </div>
  );
}

function ScreenView({ screen, answers, onAnswer, onOther, onNext, onBack, stepNum, totalSteps, editing }) {
  useEffect(() => { try { window.scrollTo(0, 0); } catch (e) {} }, [screen.id]);
  const qs = screen.questions;
  const pct = totalSteps > 0 ? Math.round((stepNum / totalSteps) * 100) : 0;
  const ok = qs.every(q => canContinue(q, answers[q.id]));
  const answered = qs.some(q => hasAnswer(q, answers[q.id]));
  const isLast = stepNum === totalSteps;
  const renderRow = q => (
    <FieldRow key={q.id} q={q} value={answers[q.id]} other={answers[q.id + "__other"]}
      onChange={val => onAnswer(q.id, val)} onOther={text => onOther(q.id, text)} />
  );
  return (
    <div style={{ display: "flex", flexDirection: "column", minHeight: "100dvh", background: NAVY, position: "relative" }}>
      <div style={{ position: "absolute", top: -100, right: -100, width: 380, height: 380, borderRadius: "50%", background: "radial-gradient(circle,rgba(200,169,110,.06) 0%,transparent 70%)", pointerEvents: "none" }} />
      <div style={{ padding: "18px 20px 0", flexShrink: 0, maxWidth: 640, margin: "0 auto", width: "100%" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
            <div dangerouslySetInnerHTML={{ __html: LOGO_SVG }} />
            <div style={{ fontSize: 9, color: GOLD, letterSpacing: ".1em", textTransform: "uppercase" }}>{editing ? "Editing your answer" : (SECTION_LABELS[qs[0].phase] || "Application Intake")}</div>
          </div>
          {!editing && <span style={{ fontSize: 10, color: GRAY }}>{pct}%</span>}
        </div>
        {!editing && (
          <div style={{ height: 3, background: "rgba(255,255,255,.07)", borderRadius: 2, marginBottom: 6 }}>
            <div style={{ height: "100%", width: pct + "%", background: `linear-gradient(90deg,${GOLD},${GOLD2})`, borderRadius: 2, transition: "width .35s ease" }} />
          </div>
        )}
      </div>

      <div style={{ flex: 1, padding: "22px 20px 0", maxWidth: 640, margin: "0 auto", width: "100%", boxSizing: "border-box" }}>
        <h2 style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 26, fontWeight: 400, lineHeight: 1.3, color: OFFWHITE, marginBottom: 18 }}>{screen.title}</h2>
        {screen.rows.map(row => row.length > 1 ? (
          <div key={row.map(q => q.id).join("|")} style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            {row.map(q => <div key={q.id} style={{ flex: "1 1 96px", minWidth: 0 }}>{renderRow(q)}</div>)}
          </div>
        ) : renderRow(row[0]))}
        {!ok && <p style={{ fontSize: 12, color: GRAY, marginTop: 4 }}>Please enter a valid email address, or clear the field to skip.</p>}
      </div>

      <div style={{ padding: "18px 20px 30px", flexShrink: 0, maxWidth: 640, margin: "0 auto", width: "100%", boxSizing: "border-box" }}>
        <div style={{ display: "flex", gap: 10 }}>
          {stepNum > 1 && !editing && (
            <button onClick={onBack} style={{ padding: "15px 20px", borderRadius: 11, fontSize: 14, fontWeight: 600, background: "rgba(255,255,255,.05)", border: `1px solid ${BORDER}`, color: GRAY, flexShrink: 0 }}>← Back</button>
          )}
          <button onClick={onNext} disabled={!ok} style={{
            flex: 1, padding: 15, borderRadius: 11, fontSize: 14, fontWeight: 700, letterSpacing: ".03em",
            background: !ok ? "rgba(255,255,255,.06)" : (editing || answered || isLast) ? GOLD : "rgba(255,255,255,.05)",
            color: !ok ? "#3A5268" : (editing || answered || isLast) ? NAVY : GOLD2,
            border: ok && !editing && !answered && !isLast ? "1px solid rgba(200,169,110,.35)" : "none",
          }}>{editing ? "Back to review →" : isLast ? "Review your answers →" : answered ? "Continue →" : "Skip for now →"}</button>
        </div>
      </div>
    </div>
  );
}

function ReviewScreen({ screens, answers, onEdit, onSubmit, busy, error }) {
  useEffect(() => { try { window.scrollTo(0, 0); } catch (e) {} }, []);
  const all = screens.flatMap(s => s.questions);
  const missing = all.filter(q => !hasAnswer(q, answers[q.id])).length;
  return (
    <div style={{ minHeight: "100dvh", background: NAVY, display: "flex", flexDirection: "column" }}>
      <div style={{ flex: 1, padding: "26px 20px 24px", maxWidth: 720, margin: "0 auto", width: "100%", boxSizing: "border-box" }}>
        <div dangerouslySetInnerHTML={{ __html: LOGO_SVG }} style={{ marginBottom: 18 }} />
        <h1 style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 32, fontWeight: 300, color: OFFWHITE, marginBottom: 8 }}>Review your answers</h1>
        <p style={{ fontSize: 14, color: WARM, lineHeight: 1.65, marginBottom: 8 }}>Look everything over. Tap <strong style={{ color: OFFWHITE }}>Edit</strong> next to anything you’d like to change. When it all looks right, submit it at the bottom of the page.</p>
        {missing > 0 && (
          <p style={{ fontSize: 13, color: GOLD2, lineHeight: 1.6, marginBottom: 6 }}>{missing} question{missing === 1 ? " is" : "s are"} not answered yet. You can answer {missing === 1 ? "it" : "them"} now, or leave {missing === 1 ? "it" : "them"} and we’ll follow up.</p>
        )}
        <div style={{ marginTop: 22 }}>
          {screens.map(screen => (
            <div key={screen.id} style={{ marginBottom: 24 }}>
              <h2 style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 20, fontWeight: 600, color: OFFWHITE, marginBottom: 6, borderBottom: `1px solid ${BORDER}`, paddingBottom: 6 }}>{screen.title}</h2>
              {screen.questions.map(q => {
                const has = hasAnswer(q, answers[q.id]);
                return (
                  <div key={q.id} style={{ display: "flex", gap: 12, alignItems: "flex-start", padding: "9px 0", borderBottom: "1px solid rgba(255,255,255,.06)" }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 12, color: GRAY, lineHeight: 1.4 }}>{labelFor(q)}</div>
                      <div style={{ fontSize: 14, color: has ? OFFWHITE : GRAY, fontStyle: has ? "normal" : "italic", lineHeight: 1.45, whiteSpace: "pre-wrap", wordBreak: "break-word" }}>{has ? fmtAnswer(q, answers[q.id], answers) : "Not answered"}</div>
                    </div>
                    <button onClick={() => onEdit(q.id)} aria-label={(has ? "Edit " : "Answer ") + labelFor(q)} style={{ flexShrink: 0, padding: "7px 14px", borderRadius: 8, fontSize: 13, fontWeight: 600, background: has ? "rgba(255,255,255,.05)" : "rgba(200,169,110,.14)", border: `1px solid ${has ? BORDER : GOLD}`, color: has ? OFFWHITE : GOLD2 }}>{has ? "Edit" : "Answer"}</button>
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      </div>
      <div style={{ position: "sticky", bottom: 0, background: NAVY, borderTop: `1px solid ${BORDER}`, padding: "14px 20px calc(14px + env(safe-area-inset-bottom, 0px))" }}>
        <div style={{ maxWidth: 720, margin: "0 auto" }}>
          {error && <p role="alert" style={{ fontSize: 13, color: "#E8A0A0", lineHeight: 1.5, marginBottom: 10 }}>{error}</p>}
          <button onClick={onSubmit} disabled={busy} style={{ display: "block", width: "100%", padding: 16, borderRadius: 11, background: busy ? "rgba(200,169,110,.5)" : GOLD, color: NAVY, fontSize: 15, fontWeight: 700, letterSpacing: ".03em" }}>{busy ? "Submitting…" : error ? "Try again →" : "Submit →"}</button>
        </div>
      </div>
    </div>
  );
}

// Tells the office the client opened their link (sent only the first time). No details, just a first name.
function notifyOpened(firstName) {
  try {
    if (typeof emailjs === "undefined") return;
    emailjs.init(EMAILJS_PUBLIC_KEY);
    const who = (firstName || "A client").replace(/[<>&]/g, "");
    const kind = INTAKE_FORM === "annuity" ? "Annuity Supplement" : "Application Intake";
    let when = "";
    try { when = new Date().toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short", timeZone: "America/New_York" }) + " Eastern"; } catch (e) { when = new Date().toISOString(); }
    const html = '<div style="font-family:Arial,sans-serif;max-width:520px;margin:0 auto;padding:24px;background:#0E1824;color:#F5F2EC;border-radius:8px;">'
      + '<p style="margin:0 0 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#C8A96E;">Link opened</p>'
      + '<h2 style="margin:0 0 10px;font-weight:400;font-size:22px;">' + who + ' opened the ' + kind + ' link</h2>'
      + '<p style="margin:0;font-size:14px;line-height:1.6;color:#C8BFA8;">Opened ' + when + '. They may not have started yet. You will get another email when they submit.</p>'
      + '<p style="margin:16px 0 0;font-size:11px;color:#6E8299;">Some email security tools open links automatically, so an alert can occasionally come from a scanner rather than the client.</p></div>';
    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE, {
      to_email: NOTIFY_EMAIL, cc_email: "", name: who + " opened their link", email: "", reply_to: NOTIFY_EMAIL,
      subject: kind + " link opened: " + who, html_content: html,
    }).catch(() => {});
  } catch (e) {}
}

function StatusScreen({ title, children, action }) {
  return (
    <div style={{ minHeight: "100dvh", background: NAVY, display: "flex", flexDirection: "column", justifyContent: "center", padding: "40px 24px" }}>
      <div style={{ maxWidth: 460, margin: "0 auto", width: "100%" }}>
        <div dangerouslySetInnerHTML={{ __html: LOGO_SVG }} style={{ marginBottom: 22 }} />
        <h1 style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 32, fontWeight: 300, lineHeight: 1.2, color: OFFWHITE, marginBottom: 14 }}>{title}</h1>
        <div style={{ fontSize: 14.5, lineHeight: 1.7, color: WARM, fontWeight: 300 }}>{children}</div>
        {action}
      </div>
    </div>
  );
}
const ContactLine = () => (
  <p style={{ marginTop: 16, fontSize: 13.5, color: WARM }}>Call our office at <strong style={{ color: OFFWHITE }}>773-318-9608</strong> or send us an email at <strong style={{ color: OFFWHITE }}>support@integratedplanningpartners.com</strong>.</p>
);

function App() {
  const [view, setView] = useState("welcome"); // welcome, flow, review, thanks
  const [answers, setAnswers] = useState({});
  const [step, setStep] = useState(0);
  const [editing, setEditing] = useState(false);
  const [hasSaved, setHasSaved] = useState(false);
  const [invite, setInvite] = useState({ state: PREVIEW ? "ok" : LINK_TOKEN ? "loading" : "error", error: LINK_TOKEN ? "" : "no_link", info: {} });
  const [busy, setBusy] = useState(false);
  const [submitError, setSubmitError] = useState("");

  const loadInvite = async () => {
    setInvite({ state: "loading", error: "", info: {} });
    const res = await callIntake({ action: "get_invite" });
    if (res.ok) { setInvite({ state: "ok", error: "", info: res }); if (res.first_open) notifyOpened(res.first_name); }
    else setInvite({ state: "error", error: res.error, info: {} });
  };

  useEffect(() => {
    const s = document.createElement("style"); s.textContent = GS; document.head.appendChild(s);
    try { void 0; } catch (e) {}
    setHasSaved(!!readSaved());
    if (!PREVIEW && LINK_TOKEN) loadInvite();
    return () => document.head.removeChild(s);
  }, []);

  useEffect(() => {
    if (view === "flow" || view === "review") {
      try { localStorage.setItem(SAVE_KEY, JSON.stringify({ answers, step, savedAt: Date.now() })); } catch (e) {}
    }
  }, [answers, step, view]);

  const presetFrom = m => (m === "none" ? { intake_done: "no", __preset: true } : m === "done" ? { intake_done: "yes", __preset: true } : {});
  const preset = PREVIEW ? presetFrom(URL_PARAMS.get("intake")) : presetFrom(invite.info.annuity_mode);
  const screens = buildScreens(answers);
  const idx = Math.min(step, Math.max(screens.length - 1, 0));
  const current = screens[idx];

  const start = () => { clearSaved(); setAnswers({ ...preset }); setStep(0); setEditing(false); setView("flow"); };
  const resume = () => {
    const saved = readSaved();
    if (!saved) { start(); return; }
    setAnswers({ ...(saved.answers || {}), ...preset });
    setStep(saved.step || 0);
    setEditing(false);
    setView("flow");
  };
  const discardSaved = () => { clearSaved(); setHasSaved(false); };

  const setAnswer = (qid, val) => setAnswers(prev => ({ ...prev, [qid]: val }));
  const setOther = (qid, text) => setAnswers(prev => ({ ...prev, [qid + "__other"]: text }));
  const next = () => {
    if (editing) { setEditing(false); setView("review"); return; }
    if (idx >= screens.length - 1) { setView("review"); return; }
    setStep(idx + 1);
  };
  const back = () => {
    if (editing) { setEditing(false); setView("review"); return; }
    if (idx > 0) setStep(idx - 1);
  };
  const editQuestion = qid => {
    const i = screens.findIndex(s => s.questions.some(q => q.id === qid));
    if (i >= 0) { setStep(i); setEditing(true); setView("flow"); }
  };
  const submit = async () => {
    if (busy) return;
    setBusy(true); setSubmitError("");
    if (!PREVIEW) {
      const all = screens.flatMap(s => s.questions);
      const res = await callIntake({
        action: "submit", answers,
        summary: buildAdvisorSummary(screens, answers),
        meta: { form: INTAKE_FORM, version: 3, question_count: all.length, skipped_count: all.filter(q => !hasAnswer(q, answers[q.id])).length },
      });
      if (!res.ok && res.error !== "already_submitted") {
        setBusy(false);
        setSubmitError(res.error === "offline"
          ? "We couldn’t reach our server. Check your connection and tap Try again. Your answers are saved on this device."
          : res.error === "expired" || res.error === "invalid_link"
            ? "This link is no longer active. Please contact our office and we’ll send a new one."
            : "Something went wrong sending your answers. Please tap Try again, or contact our office if it keeps happening.");
        return;
      }
      if (res.ok) notifyTeam(answers, res.submission_id);
    }
    clearSaved();
    setBusy(false);
    setView("thanks");
  };

  if (invite.state === "loading") return <StatusScreen title="One moment…"><p>Opening your secure form.</p></StatusScreen>;
  if (invite.state === "error") {
    const e = invite.error;
    if (e === "already_submitted") return <StatusScreen title="This form was already submitted."><p>Thank you. We have your answers. If you need to change something, please reach out.</p><ContactLine /></StatusScreen>;
    if (e === "expired") return <StatusScreen title="This link has expired."><p>For your security, links stop working after a while. We’ll gladly send you a new one.</p><ContactLine /></StatusScreen>;
    if (e === "offline" || e === "failed") return <StatusScreen title="We couldn’t reach our server." action={<button onClick={loadInvite} style={{ marginTop: 18, padding: "13px 22px", borderRadius: 10, background: GOLD, color: NAVY, fontSize: 14, fontWeight: 700 }}>Try again</button>}><p>Check your internet connection and try again.</p><ContactLine /></StatusScreen>;
    return <StatusScreen title="This link isn’t working."><p>This page needs the personal link your advisor sent you. The link may be incomplete, replaced, or turned off.</p><ContactLine /></StatusScreen>;
  }

  if (view === "welcome") return <WelcomeScreen onStart={start} hasSaved={hasSaved} onResume={resume} onClear={discardSaved} />;
  if (view === "review") return <ReviewScreen screens={screens} answers={answers} onEdit={editQuestion} onSubmit={submit} busy={busy} error={submitError} />;
  if (view === "thanks") return <SummaryScreen answers={answers} screens={screens} onStartOver={start} />;
  if (view === "flow" && current) {
    return <ScreenView screen={current} answers={answers} onAnswer={setAnswer} onOther={setOther} onNext={next} onBack={back} stepNum={idx + 1} totalSteps={screens.length || 1} editing={editing} />;
  }
  return null;
}

ReactDOM.render(<App />, document.getElementById("root"));

</script>
</body>
</html>
